name: Update Liquidity Data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 오전 9시) 
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write  # Git 푸시 권한

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv
      
      - name: Run daily update script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd automation
          echo "FRED_API_KEY=$FRED_API_KEY" > .env
          python fetch_liquidity_data.py
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update liquidity data from FRED [automated]"
          file_pattern: "public/data/liquidity-data.json"

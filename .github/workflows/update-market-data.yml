name: Update Market Data

on:
  schedule:
    # 매일 UTC 15:00 (한국 시간 자정)
    - cron: '0 15 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write  # Git 푸시 권한

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance investpy requests python-dotenv
      
      - name: Run daily update script
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          cd automation
          echo "COINGECKO_API_KEY=$COINGECKO_API_KEY" > .env
          python fetch_market_data.py
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update market data [automated]"
          file_pattern: "public/data/dashboard-data.json"
